<g id="L-labels">
<text x="674.5" y="754.4" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">GUEST / STUDY</text>
<text x="674.5" y="832.4" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the one spare room: a desk under the north window, a bed for visitors</text>
<text x="1356.7" y="812.9" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">KITCHEN</text>
<text x="1356.7" y="890.9" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the whole north band, two windows, open to the dining across a bowed c</text>
<text x="1867.4" y="812.9" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">BATH &amp; UTILITY</text>
<text x="1867.4" y="846.0" font-family="Helvetica,Arial" font-size="10" fill="#2c5c61" font-weight="normal" letter-spacing="2" text-anchor="middle">COMMON</text>
<text x="1867.4" y="906.5" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the builder's toilet position, on its shaft — bath, washing machine an</text>
<text x="2321.6" y="793.4" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">FAMILY BEDROOM</text>
<text x="2321.6" y="871.4" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">one room for all three: the adults south, the child's end north behind</text>
<text x="1867.4" y="1319.7" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">VESTIBULE</text>
<text x="1867.4" y="1397.7" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the arched threshold into the family wing, and the way to the common b</text>
<text x="1867.4" y="1670.6" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">BATH</text>
<text x="1867.4" y="1703.7" font-family="Helvetica,Arial" font-size="10" fill="#2c5c61" font-weight="normal" letter-spacing="2" text-anchor="middle">FAMILY</text>
<text x="1867.4" y="1764.1" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">on the south-east shaft, entered from the bedroom</text>
<text x="1239.8" y="1826.5" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">LIVING / DINING</text>
<text x="1239.8" y="1904.5" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">one room from the front door to the balcony, read through three arches</text>
<text x="650.1" y="2372.3" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">FOYER</text>
<text x="650.1" y="2450.2" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the way in</text>
<text x="1415.2" y="2645.2" font-family="Helvetica,Arial" font-size="15" fill="#1d1b18" font-weight="bold" letter-spacing="1.1" text-anchor="middle">BALCONY</text>
<text x="1415.2" y="2723.1" font-family="Helvetica,Arial" font-size="9" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">off the living room</text>
</g>
