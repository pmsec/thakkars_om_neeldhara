<g id="L-labels">
<text x="-2261.8" y="1230.9" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">GUEST / STUDY</text>
<text x="-2261.8" y="1430.2" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the one spare room: a desk under the north window, a bed for visitors</text>
<text x="-517.9" y="1380.4" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">KITCHEN</text>
<text x="-517.9" y="1579.7" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the whole north band, two windows, open to the dining across a bowed c</text>
<text x="1948.4" y="1330.6" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">FAMILY BEDROOM</text>
<text x="1948.4" y="1529.9" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">one room for all three: the adults south, the child's end north behind</text>
<text x="787.5" y="2675.9" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">VESTIBULE</text>
<text x="787.5" y="2875.2" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the arched threshold into the family wing, and the way to the common b</text>
<text x="787.5" y="3572.7" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">BATH</text>
<text x="787.5" y="3657.4" font-family="Helvetica,Arial" font-size="17.5611" fill="#2c5c61" font-weight="normal" letter-spacing="3.51221" text-anchor="middle">FAMILY</text>
<text x="787.5" y="3811.9" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">on the south-east shaft, entered from the bedroom</text>
<text x="-816.8" y="3971.3" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">LIVING / DINING</text>
<text x="-816.8" y="4170.6" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">one room from the front door to the balcony, read through three arches</text>
<text x="-2324.0" y="5366.4" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">FOYER</text>
<text x="-2324.0" y="5565.7" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">the way in</text>
<text x="-368.4" y="6063.9" font-family="Helvetica,Arial" font-size="26.3416" fill="#1d1b18" font-weight="bold" letter-spacing="1.93172" text-anchor="middle">BALCONY</text>
<text x="-368.4" y="6263.2" font-family="Helvetica,Arial" font-size="15.805" fill="#6f6a61" font-weight="normal" letter-spacing="0" text-anchor="middle">off the living room</text>
</g>
